<title>La Tonneria</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Yellowtail&family=Caveat:wght@500;700&family=Figtree:wght@400;600;700&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
  /* Layout: scena WebGL a tutto schermo, una scheda di controllo in basso a sinistra */
  :root {
    --scene: #dcebf2;
    --panel: rgba(255,255,255,0.9);
    --fg: #17323a;
    --muted: #557079;
    --line: #c8dbe2;
    --yellow: #f4c20d;
    --teal: #1f9e94;
    --azure: #2b9fd8;
    --font-brand: "Bungee", "Arial Black", system-ui, sans-serif;
    --font-ui: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --scene: #0f1b21; --panel: rgba(20,34,40,0.9); --fg: #e6f3f6; --muted: #93b0b9;
      --line: #2c444d; --teal: #4cc7bc; --azure: #5ab9ea; color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --scene: #0f1b21; --panel: rgba(20,34,40,0.9); --fg: #e6f3f6; --muted: #93b0b9;
    --line: #2c444d; --teal: #4cc7bc; --azure: #5ab9ea; color-scheme: dark;
  }
  html, body { height: 100%; overflow: hidden; }
  body { background: var(--scene); color: var(--fg); font-family: var(--font-ui); }
  canvas#view { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }

  .panel {
    position: fixed;
    left: max(16px, env(safe-area-inset-left, 0px));
    bottom: calc(16px + env(safe-area-inset-bottom, 0px));
    width: 310px; max-width: calc(100% - 32px);
    background: var(--panel); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    border: 1px solid var(--line); border-radius: 14px;
    box-shadow: 0 10px 30px rgba(10,40,50,0.15);
  }
  .panel summary {
    list-style: none; cursor: pointer; padding: 14px 16px;
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
  }
  .panel summary::-webkit-details-marker { display: none; }
  .brand { font-family: var(--font-brand); font-size: 18px; letter-spacing: 0.02em; color: var(--fg); }
  .brand b { color: var(--teal); font-weight: 400; }
  .chev { font-size: 12px; color: var(--muted); transition: transform .2s; }
  details[open] .chev { transform: rotate(180deg); }
  .body { padding: 0 16px 16px; display: flex; flex-direction: column; gap: 14px; }
  .prices { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { font-size: 12px; font-weight: 600; padding: 4px 9px; border-radius: 999px; border: 1px solid var(--line); font-variant-numeric: tabular-nums; }
  .chip.y { background: var(--yellow); border-color: var(--yellow); color: #3a2c00; }
  .field { display: flex; flex-direction: column; gap: 6px; }
  .field label, .lbl { font-size: 11px; text-transform: uppercase; letter-spacing: 0.07em; color: var(--muted); font-weight: 700; }
  select {
    font: 500 14px var(--font-ui); color: var(--fg); background: transparent;
    border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; width: 100%;
  }
  .views { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .views .btn { font-size: 12px; padding: 8px 2px; }
  button.btn {
    font: 600 13px var(--font-ui); color: var(--fg); background: transparent;
    border: 1px solid var(--line); border-radius: 8px; padding: 8px 6px; cursor: pointer;
  }
  button.btn[aria-pressed="true"] { background: var(--teal); border-color: var(--teal); color: #fff; }
  button:focus-visible, select:focus-visible, summary:focus-visible { outline: 2px solid var(--azure); outline-offset: 2px; }
  .hint { font-size: 11px; color: var(--muted); margin: 0; }
  @media (prefers-reduced-motion: reduce) { .chev { transition: none; } }
  /* Bottone sopra il personaggio */
  .talk {
    position: fixed; left: 0; top: 0; transform: translate(-50%, -100%); z-index: 5;
    display: inline-flex; align-items: center; gap: 8px;
    font: 700 14px var(--font-ui); color: #2a2100; background: var(--yellow);
    border: 3px solid #17323a; border-radius: 999px; padding: 6px 14px 6px 6px; cursor: pointer;
    box-shadow: 0 4px 0 #17323a; animation: bob 1.6s ease-in-out infinite;
  }
  .talk .bang { width: 24px; height: 24px; border-radius: 50%; background: #1f9e94; color: #fff; display: grid; place-items: center; font-family: var(--font-brand); font-size: 13px; }
  .talk kbd { font: 600 11px var(--font-ui); border: 1.5px solid #17323a; border-radius: 4px; padding: 0 4px; opacity: .7; }
  .talk:active { transform: translate(-50%, calc(-100% + 3px)); box-shadow: 0 1px 0 #17323a; }
  .talk[hidden], .dlg[hidden], .panel[hidden] { display: none !important; }
  @keyframes bob { 50% { margin-top: -6px; } }
  /* Riquadro di dialogo: look volutamente unico, da videogioco, in entrambi i temi */
  .dlg {
    position: fixed; z-index: 6; left: 50%; transform: translateX(-50%);
    bottom: calc(16px + env(safe-area-inset-bottom, 0px));
    width: min(760px, calc(100% - 32px));
    background: #ffffff; color: #17323a;
    border: 4px solid #17323a; border-radius: 14px;
    box-shadow: inset 0 0 0 3px #ffffff, inset 0 0 0 7px #1f9e94, 0 10px 30px rgba(0,0,0,.25);
    padding: 22px 28px 20px; cursor: pointer; outline: none; user-select: none;
  }
  .dlg .who {
    position: absolute; top: -18px; left: 22px; background: #f4c20d; color: #2a2100;
    border: 3px solid #17323a; border-radius: 8px; padding: 2px 10px;
    font: 700 14px "Atkinson Hyperlegible", var(--font-ui);
  }
  .dlg p { margin: 0; font: 400 20px/31px "Atkinson Hyperlegible", var(--font-ui); height: 62px; overflow: hidden; }
  .dlg .next { position: absolute; right: 22px; bottom: 12px; color: #1f9e94; font-size: 16px; animation: blink .8s steps(2) infinite; }
  .dlg .key { position: absolute; right: 46px; bottom: 12px; font: 500 12px var(--font-ui); color: #557079; }
  @keyframes blink { 50% { opacity: 0; } }
  @media (max-width: 520px) { .dlg p { font-size: 17px; line-height: 26px; height: 52px; } .dlg .key { display: none; } }
  @media (prefers-reduced-motion: reduce) { .talk, .dlg .next { animation: none; } }

</style>

<canvas id="view"></canvas>

<details class="panel" open>
  <summary><span class="brand">La <b>Tonneria</b></span><span class="chev" aria-hidden="true">▼</span></summary>
  <div class="body">
    <div class="field">
      <span class="lbl">Vista</span>
      <div class="views">
        <button class="btn" data-view="ingresso" aria-pressed="true">Ingresso</button>
        <button class="btn" data-view="bancone" aria-pressed="false">Bancone</button>
        <button class="btn" data-view="alto" aria-pressed="false">Dall'alto</button>
      </div>
    </div>
  </div>
</details>

<button class="talk" id="talk" hidden><span class="bang" aria-hidden="true">!</span>Interagisci <kbd aria-hidden="true">E</kbd></button>

<div class="dlg" id="dlg" hidden role="dialog" aria-label="Dialogo con il ragazzo della Tonneria" tabindex="-1">
  <span class="who">Ragazzo della Tonneria</span>
  <p id="dlgText" aria-live="polite"></p>
  <span class="key">Spazio per continuare</span>
  <span class="next" id="dlgNext" aria-hidden="true">▼</span>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
(async () => {
  // ================= DIMENSIONI DEL LOCALE (metri) =================
  const W = 4.2;   // larghezza (parete vetrata / bancone)
  const D = 5.0;   // profondità (dall'ingresso alla parete della lavagna)
  const H = 3.0;   // altezza
  const TILE_H = 1.2; // altezza delle piastrelle bianche
  const BACK = -D / 2, FRONT = D / 2, LEFT = -W / 2, RIGHT = W / 2;

  // Palette
  const C = { yellow: '#f4c20d', teal: '#1f9e94', azure: '#2b9fd8', aqua: '#8fd3cf', navy: '#17323a', wall: '#cfe8f6' };

  // Menu: una pasta diversa ogni giorno
  const DISHES = [
    { id: 'linguine',   name: 'Linguine tonno e limone',                      shape: 'linguine',  base: '#ecd08a', extras: ['lemon'] },
    { id: 'maccheroni', name: 'Maccheroni tonno, pomodorini e peperoncino',   shape: 'tube',      base: '#e3a463', extras: ['tomato', 'chili'] },
    { id: 'spaghetti',  name: 'Spaghetto tonno e cipolle',                    shape: 'spaghetti', base: '#e9cc86', extras: ['onion'] },
    { id: 'penne',      name: 'Penne tonno, olive e capperi',                 shape: 'penne',     base: '#e6c47c', extras: ['olive', 'caper'] },
    { id: 'fusilli',    name: 'Fusilli tonno e zucchine',                     shape: 'fusilli',   base: '#e8ca82', extras: ['zucchini'] },
  ];

  // Aspetta i font (servono per disegnare scritte, neon e lavagna)
  try {
    await Promise.race([
      Promise.all(['40px "Bungee"', '40px "Yellowtail"', '700 40px "Caveat"', '500 40px "Caveat"'].map(f => document.fonts.load(f))),
      new Promise(r => setTimeout(r, 2500)),
    ]);
  } catch (e) {}

  // ================= RENDERER, SCENA, CAMERA =================
  const canvas = document.getElementById('view');
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.2;

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(50, 1, 0.05, 100);
  const controls = new THREE.OrbitControls(camera, canvas);
  controls.enableDamping = true;
  controls.maxPolarAngle = Math.PI * 0.495;
  controls.minDistance = 0.6;
  controls.maxDistance = 16;

  function syncBackground() {
    const c = getComputedStyle(document.documentElement).getPropertyValue('--scene').trim() || '#dcebf2';
    scene.background = new THREE.Color(c);
  }
  syncBackground();
  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', syncBackground);
  new MutationObserver(syncBackground).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });

  // ================= LUCI =================
  scene.add(new THREE.HemisphereLight(0xffffff, 0xc9b49a, 0.6));
  const key = new THREE.DirectionalLight(0xfff4e6, 0.9);
  key.position.set(1.5, 7, 3.5);
  key.castShadow = true;
  key.shadow.mapSize.set(2048, 2048);
  key.shadow.bias = -0.0005; key.shadow.normalBias = 0.02;
  Object.assign(key.shadow.camera, { left: -5, right: 5, top: 5, bottom: -5, near: 1, far: 20 });
  scene.add(key);

  // ================= HELPERS =================
  const rand = seed => () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
  const mat = (color, o = {}) => new THREE.MeshStandardMaterial(Object.assign({ color, roughness: 0.8 }, o));
  function add(mesh, x, y, z, parent = scene, shadow = true) {
    mesh.position.set(x, y, z);
    mesh.castShadow = mesh.receiveShadow = shadow;
    parent.add(mesh);
    return mesh;
  }
  const box = (w, h, d, m, x, y, z, p) => add(new THREE.Mesh(new THREE.BoxGeometry(w, h, d), m), x, y, z, p);
  const cyl = (rt, rb, h, m, x, y, z, p, seg = 24) => add(new THREE.Mesh(new THREE.CylinderGeometry(rt, rb, h, seg), m), x, y, z, p);

  function makeCanvas(w, h, draw) {
    const c = document.createElement('canvas'); c.width = w; c.height = h;
    draw(c.getContext('2d'), w, h);
    return c;
  }
  function tex(canvasEl, repeat) {
    const t = new THREE.CanvasTexture(canvasEl);
    t.encoding = THREE.sRGBEncoding;
    t.anisotropy = renderer.capabilities.getMaxAnisotropy();
    if (repeat) { t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(repeat[0], repeat[1]); }
    return t;
  }
  // Piano con texture da canvas (sticker, neon, cartellini)
  function decal(canvasEl, w, h, opts = {}) {
    const m = new THREE.MeshBasicMaterial(Object.assign({ map: tex(canvasEl), transparent: true, side: THREE.DoubleSide, toneMapped: false, depthWrite: false }, opts));
    return new THREE.Mesh(new THREE.PlaneGeometry(w, h), m);
  }

  // ================= IL TONNO STILIZZATO =================
  // Coordinate normalizzate: muso a sinistra (x=-1), coda a destra (x≈1). s = metà lunghezza in px.
  function drawTuna(g, cx, cy, s, o = {}) {
    const fill = o.fill ?? C.aqua, fin = o.fin ?? C.azure, stroke = o.stroke ?? '#262a2c', hl = o.highlight ?? '#ffffff';
    const lw = s * (o.lw ?? 0.075);
    g.save(); g.translate(cx, cy); g.scale(s, s);
    g.lineJoin = 'round'; g.lineCap = 'round'; g.lineWidth = lw / s; g.strokeStyle = stroke;
    const shape = (f, pathFn) => { g.beginPath(); pathFn(); g.closePath(); if (f) { g.fillStyle = f; g.fill(); } g.stroke(); };
    // pinne
    shape(fin, () => { g.moveTo(-0.42, -0.24); g.quadraticCurveTo(-0.34, -0.5, -0.2, -0.62); g.quadraticCurveTo(-0.12, -0.42, 0.14, -0.3); });
    shape(fin, () => { g.moveTo(0.1, -0.27); g.lineTo(0.44, -0.5); g.quadraticCurveTo(0.32, -0.34, 0.3, -0.2); });
    shape(fin, () => { g.moveTo(-0.34, 0.26); g.lineTo(-0.26, 0.6); g.lineTo(-0.14, 0.29); });
    shape(fin, () => { g.moveTo(0.12, 0.25); g.lineTo(0.44, 0.48); g.quadraticCurveTo(0.33, 0.32, 0.32, 0.2); });
    // coda a mezzaluna
    shape(fin, () => { g.moveTo(0.7, 0); g.quadraticCurveTo(0.86, -0.22, 1.04, -0.46); g.quadraticCurveTo(0.9, -0.12, 0.92, 0); g.quadraticCurveTo(0.9, 0.12, 1.04, 0.46); g.quadraticCurveTo(0.86, 0.22, 0.7, 0); });
    // corpo
    shape(fill, () => {
      g.moveTo(-1, 0.01);
      g.bezierCurveTo(-0.72, -0.3, 0.15, -0.38, 0.8, 0);
      g.bezierCurveTo(0.15, 0.36, -0.72, 0.32, -1, 0.01);
    });
    // pinnule sul dorso
    g.lineWidth = (lw * 0.85) / s;
    for (let i = 0; i < 4; i++) { const x = 0.42 + i * 0.075, y = -0.17 + i * 0.045; g.beginPath(); g.moveTo(x, y); g.lineTo(x + 0.01, y - 0.07); g.stroke(); }
    g.lineWidth = lw / s;
    // bocca, occhio, branchia, pinna pettorale
    g.beginPath(); g.moveTo(-1, 0.01); g.lineTo(-0.9, 0.02); g.stroke();
    g.beginPath(); g.arc(-0.7, -0.03, 0.035, 0, Math.PI * 2); g.fillStyle = stroke; g.fill();
    g.beginPath(); g.moveTo(-0.52, -0.1); g.quadraticCurveTo(-0.42, 0.04, -0.53, 0.18); g.stroke();
    g.beginPath(); g.moveTo(-0.06, -0.06); g.lineTo(-0.34, 0.02); g.lineTo(-0.1, 0.12); g.stroke();
    // riflesso
    if (hl) { g.strokeStyle = hl; g.lineWidth = (lw * 0.9) / s; g.beginPath(); g.moveTo(-0.3, -0.18); g.lineTo(0.06, -0.19); g.stroke(); }
    g.restore();
  }

  // ================= TEXTURE PROCEDURALI =================
  // Parquet finto: listoni sfalsati
  const floorTex = tex(makeCanvas(1024, 1024, (g, s) => {
    const r = rand(7), rows = 8, rh = s / rows;
    for (let i = 0; i < rows; i++) {
      const off = r() * s;
      for (let k = -2; k < 3; k++) {
        const x0 = off + k * s * 0.5 - s * 0.5;
        g.fillStyle = `hsl(${30 + r() * 6} 40% ${54 + r() * 10}%)`;
        g.fillRect(x0, i * rh, s * 0.5, rh);
        g.globalAlpha = 0.16;
        for (let j = 0; j < 14; j++) {
          g.strokeStyle = r() > 0.5 ? '#6b4a2b' : '#f0d2a2'; g.lineWidth = 0.5 + r() * 1.5;
          const y = i * rh + r() * rh;
          g.beginPath(); g.moveTo(x0, y); g.bezierCurveTo(x0 + s * 0.15, y + (r() - 0.5) * 6, x0 + s * 0.35, y + (r() - 0.5) * 6, x0 + s * 0.5, y); g.stroke();
        }
        g.globalAlpha = 1; g.fillStyle = 'rgba(60,40,22,0.5)'; g.fillRect(x0, i * rh, 2, rh);
      }
      g.fillStyle = 'rgba(60,40,22,0.55)'; g.fillRect(0, i * rh, s, 2);
    }
  }), [W / 2.4, D / 2.4]);

  // Piastrelle rettangolari bianche (20×10 cm, posa sfalsata): il canvas copre 80×80 cm
  const tileCanvas = makeCanvas(512, 512, (g, s) => {
    g.fillStyle = '#c9d2d6'; g.fillRect(0, 0, s, s);
    const tw = s / 4, th = s / 8, r = rand(3);
    for (let row = 0; row < 8; row++) for (let col = -1; col < 5; col++) {
      const x = col * tw + (row % 2 ? tw / 2 : 0), y = row * th;
      const l = 96 + r() * 3;
      g.fillStyle = `hsl(200 20% ${l}%)`; g.fillRect(x + 2, y + 2, tw - 4, th - 4);
      const grd = g.createLinearGradient(x, y, x, y + th);
      grd.addColorStop(0, 'rgba(255,255,255,0.6)'); grd.addColorStop(1, 'rgba(0,0,0,0.04)');
      g.fillStyle = grd; g.fillRect(x + 2, y + 2, tw - 4, th - 4);
    }
  });

  // Doghe finto legno per il bancone
  const slatTex = tex(makeCanvas(1024, 512, (g, w, h) => {
    const r = rand(11), n = 12, sw = w / n;
    for (let i = 0; i < n; i++) {
      g.fillStyle = `hsl(${27 + r() * 7} 42% ${44 + r() * 12}%)`; g.fillRect(i * sw, 0, sw, h);
      g.globalAlpha = 0.18;
      for (let j = 0; j < 10; j++) {
        g.strokeStyle = r() > 0.5 ? '#5a3a20' : '#e8c08a'; g.lineWidth = 0.6 + r() * 1.4;
        const x = i * sw + r() * sw; g.beginPath(); g.moveTo(x, 0); g.bezierCurveTo(x + (r() - .5) * 8, h * .3, x + (r() - .5) * 8, h * .7, x, h); g.stroke();
      }
      g.globalAlpha = 1; g.fillStyle = 'rgba(40,25,12,0.6)'; g.fillRect(i * sw, 0, 3, h);
    }
  }), [3.6, 1]);

  // ================= MATERIALI =================
  const M = {
    floor: mat('#ffffff', { map: floorTex, roughness: 0.55 }),
    paint: mat(C.wall, { roughness: 0.95 }),
    trimTeal: mat(C.teal, { roughness: 0.5 }),
    alu: mat('#2f3d43', { roughness: 0.4, metalness: 0.6 }),
    glass: new THREE.MeshStandardMaterial({ color: 0xd7f0ff, transparent: true, opacity: 0.14, roughness: 0.05, depthWrite: false }),
    pavement: mat('#b9bec1', { roughness: 1 }),
    curb: mat('#9aa1a5', { roughness: 1 }),
    slat: mat('#ffffff', { map: slatTex, roughness: 0.6 }),
    top: mat('#f3f1ec', { roughness: 0.35 }),
    steel: mat('#b9bfc3', { roughness: 0.3, metalness: 0.85 }),
    darkSteel: mat('#8d9499', { roughness: 0.35, metalness: 0.8 }),
    black: mat('#1e2326', { roughness: 0.5 }),
    wood: mat('#7a5233', { roughness: 0.6 }),
    yellow: mat(C.yellow, { roughness: 0.5 }),
    teal: mat(C.teal, { roughness: 0.5 }),
    plastic: new THREE.MeshStandardMaterial({ color: 0xffffff, transparent: true, opacity: 0.45, roughness: 0.15 }),
    occluder: new THREE.MeshBasicMaterial({ colorWrite: false, depthWrite: false }),
  };

  // Ambiente riflesso per l'acciaio (teglie, piani, maniglie)
  (function steelEnv() {
    const pmrem = new THREE.PMREMGenerator(renderer), es = new THREE.Scene();
    const geo = new THREE.SphereGeometry(10, 32, 16), pos = geo.attributes.position, cols = [];
    const top = new THREE.Color('#ffffff'), mid = new THREE.Color('#7f8c94'), low = new THREE.Color('#4a4038'), c = new THREE.Color();
    for (let i = 0; i < pos.count; i++) { const y = pos.getY(i) / 10; y > 0 ? c.copy(mid).lerp(top, y) : c.copy(mid).lerp(low, Math.min(1, -y * 2)); cols.push(c.r, c.g, c.b); }
    geo.setAttribute('color', new THREE.Float32BufferAttribute(cols, 3));
    es.add(new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ vertexColors: true, side: THREE.BackSide })));
    [[0, 6, 0, Math.PI / 2, 0], [0, 3, -8, 0, 0], [8, 3, 0, 0, -Math.PI / 2]].forEach(([x, y, z, rx, ry]) => {
      const pnl = new THREE.Mesh(new THREE.PlaneGeometry(5, 1.5), new THREE.MeshBasicMaterial({ color: 0xffffff, side: THREE.DoubleSide }));
      pnl.position.set(x, y, z); pnl.rotation.set(rx, ry, 0); es.add(pnl);
    });
    const env = pmrem.fromScene(es, 0.03).texture;
    [M.steel, M.darkSteel, M.alu].forEach(m => { m.envMap = env; m.envMapIntensity = 0.7; m.needsUpdate = true; });
  })();

  // ================= PAVIMENTO E MARCIAPIEDE =================
  const floor = new THREE.Mesh(new THREE.PlaneGeometry(W, D), M.floor);
  floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; scene.add(floor);
  box(W + 0.3, 0.15, D + 0.3, M.curb, 0, -0.076, 0).castShadow = false;
  const pave = box(W + 4, 0.06, 3, M.pavement, 0, -0.03, FRONT + 1.65); pave.castShadow = false;

  // ================= PARETI (sinistra, fondo, destra) =================

  // Altezza del cibo nella teglia: un cumulo morbido con piccole irregolarità

    return { sh, el };
  }
  const armR = arm(1), armL = arm(-1);

  // collo e testa
  cyl(0.046, 0.052, 0.12, PM.skin, 0, 0.6, 0, torso, 18);
  const head = new THREE.Group(); head.position.y = 0.72; torso.add(head);
  const cranium = sph(0.104, PM.skin, 0, 0.014, -0.006, head, 36, 26); cranium.scale.set(0.88, 1.0, 1.0);
  const jaw = sph(0.088, PM.skin, 0, -0.035, 0.012, head, 32, 22); jaw.scale.set(0.82, 0.86, 0.9);
  const chin = sph(0.032, PM.skin, 0, -0.083, 0.05, head); chin.scale.set(1.25, 0.8, 0.9);
  // occhi (gruppo per lato: si scala in verticale per il battito di ciglia)
  const eyes = [-1, 1].map(s => {
    const g = new THREE.Group(); g.position.set(s * 0.034, 0.008, 0.088); head.add(g);
    sph(0.0145, PM.sclera, 0, 0, 0, g, 16, 12);
    sph(0.0098, PM.iris, 0, 0, 0.0085, g, 16, 12).scale.z = 0.6;
    sph(0.0048, PM.pupil, 0, 0, 0.0128, g, 10, 8).scale.z = 0.5;
    const lid = add(new THREE.Mesh(new THREE.SphereGeometry(0.0155, 16, 8, 0, Math.PI * 2, 0, Math.PI * 0.42), PM.skin), 0, 0.001, -0.001, g); lid.rotation.x = 0.1;
    return g;
  });
  [-1, 1].forEach(s => { const b = box(0.032, 0.0065, 0.012, PM.hair, s * 0.036, 0.031, 0.093, head); b.rotation.z = s * -0.14; });
  // naso
  const bridge = sph(0.013, PM.skin, 0, -0.012, 0.096, head); bridge.scale.set(0.75, 1.7, 0.9);
  sph(0.0105, PM.skin, 0, -0.03, 0.104, head);
  [-1, 1].forEach(s => sph(0.0055, PM.skinDark, s * 0.009, -0.035, 0.099, head, 10, 8));
  // bocca: labbra + interno che si apre quando parla
  const mouth = sph(0.011, PM.mouthIn, 0, -0.059, 0.089, head, 14, 8); mouth.geometry.scale(1.9, 0.25, 0.5);
  const upperLip = sph(0.012, PM.lips, 0, -0.055, 0.092, head, 16, 8); upperLip.scale.set(2.0, 0.42, 0.7);
  const LIP_Y = -0.063;
  const lowerLip = sph(0.012, PM.lips, 0, LIP_Y, 0.091, head, 16, 8); lowerLip.scale.set(1.8, 0.5, 0.75);
  // orecchie
  [-1, 1].forEach(s => { const e = sph(0.022, PM.skin, s * 0.091, -0.002, -0.006, head, 14, 10); e.scale.set(0.42, 1, 0.72); });
  // capelli corti (nuca e lati) + basette
  const hairShell = add(new THREE.Mesh(new THREE.SphereGeometry(0.108, 32, 18, Math.PI / 2 + 0.95, Math.PI * 2 - 1.9, 0, Math.PI * 0.6), PM.hair), 0, 0.016, -0.008, head);
  hairShell.scale.set(0.9, 1, 1.02);
  [-1, 1].forEach(s => box(0.008, 0.035, 0.022, PM.hair, s * 0.084, 0.012, 0.03, head));
  // cappellino da baseball: calotta, fascia gialla, visiera curva
  const crown = add(new THREE.Mesh(new THREE.SphereGeometry(0.112, 36, 16, 0, Math.PI * 2, 0, Math.PI / 2), PM.cap), 0, 0.052, -0.006, head);
  crown.scale.set(0.92, 0.85, 1.02);
  const band = add(new THREE.Mesh(new THREE.CylinderGeometry(0.104, 0.104, 0.014, 36, 1, true), PM.apron), 0, 0.052, -0.006, head);
  band.scale.set(0.92, 1, 1.02);
  sph(0.008, PM.apron, 0, 0.146, -0.006, head, 10, 8);
  const brim = add(new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.1, 0.007, 32, 1, false, -Math.PI / 2, Math.PI), PM.apron), 0, 0.048, 0.05, head);
  brim.scale.set(0.95, 1, 0.95); brim.rotation.x = 0.12;

  // ---------- animazione ----------
  const lerp = (a, b, k) => a + (b - a) * k, clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const hp = new THREE.Vector3(), dv = new THREE.Vector3();
  let nextBlink = 2000, blinkUntil = 0, waveUntil = 0, talking = false;
  function updateBoy(now) {
    const t = now / 1000;
    torso.scale.y = 1 + Math.sin(t * 2.1) * 0.008;
    torso.rotation.z = Math.sin(t * 0.9) * 0.015;
    if (now > nextBlink) { blinkUntil = now + 130; nextBlink = now + 2200 + Math.random() * 3200; }
    eyes.forEach(e => e.scale.y = now < blinkUntil ? 0.15 : 1);
    head.getWorldPosition(hp); dv.copy(camera.position).sub(hp);
    const yaw = clamp(Math.atan2(dv.x, dv.z), -0.75, 0.75), pitch = clamp(-Math.atan2(dv.y, Math.hypot(dv.x, dv.z)), -0.35, 0.3) * 0.6;
    head.rotation.y = lerp(head.rotation.y, yaw, 0.08); head.rotation.x = lerp(head.rotation.x, pitch, 0.08);
    mouth.scale.y = talking ? 1 + 3.2 * Math.abs(Math.sin(t * 17)) : lerp(mouth.scale.y, 1, 0.3);
    lowerLip.position.y = LIP_Y - (mouth.scale.y - 1) * 0.0035;
    const k = 0.12;
    if (now < waveUntil) {
      armR.sh.rotation.x = lerp(armR.sh.rotation.x, -0.15, k); armR.sh.rotation.z = lerp(armR.sh.rotation.z, 2.55, k);
      armR.el.rotation.x = lerp(armR.el.rotation.x, 0, k); armR.el.rotation.z = 0.45 + 0.4 * Math.sin(t * 11);
    } else if (talking) {
      armR.sh.rotation.x = lerp(armR.sh.rotation.x, -0.55 + 0.12 * Math.sin(t * 3), k); armR.sh.rotation.z = lerp(armR.sh.rotation.z, 0.15, k);
      armR.el.rotation.x = lerp(armR.el.rotation.x, -0.95 + 0.25 * Math.sin(t * 4.3), k); armR.el.rotation.z = lerp(armR.el.rotation.z, 0, k);
    } else {
      armR.sh.rotation.x = lerp(armR.sh.rotation.x, -0.42, k); armR.sh.rotation.z = lerp(armR.sh.rotation.z, 0.12, k);
      armR.el.rotation.x = lerp(armR.el.rotation.x, -0.6, k); armR.el.rotation.z = lerp(armR.el.rotation.z, 0, k);
    }
    armL.sh.rotation.z = -0.12; armL.sh.rotation.x = lerp(armL.sh.rotation.x, -0.42, k);
    armL.el.rotation.x = lerp(armL.el.rotation.x, talking ? -0.6 + 0.12 * Math.sin(t * 3.7) : -0.6, k);
  }

  // ================= DIALOGO (stile giochi Pokémon) =================
  const DIALOG_FIRST = [
    'Ciao, benvenuto in Tonneria! Cosa ti posso servire?',
    '...',
    'Ah, non sei qui per pranzare: vorresti invece entrare a far parte della famiglia della Tonneria!',
    'Che bello! Siamo sempre pronti ad accogliere nuovi ragazzi volenterosi e con tanta voglia di mettersi in gioco!',
    'Quanto ne sai di tonno?',
    '...',
    'Ah, non molto eh? Beh, allora prima di iniziare qui devi fare un corso completo per imparare a conoscere tutto il percorso produttivo del tonno!',
    'Come forse sai, il tonno viene pescato in mare aperto. Tu sai navigare? Sei mai stato su una barca?',
    '...',
    'No? Okay, allora dobbiamo partire proprio da qui: iniziamo imparando ad andare in barca a vela!',
    'Una volta acquisite le basi torna qui, e sono sicuro che riusciremo a trovarti un buon posto dove lavorare!',
  ];
  const DIALOG_AGAIN = ['Prima di lavorare da noi devi imparare a navigare. Non preoccuparti, la famiglia della Tonneria ti sta aspettando!'];

  const dlg = document.getElementById('dlg'), dlgText = document.getElementById('dlgText'), dlgNext = document.getElementById('dlgNext');
  const talkBtn = document.getElementById('talk'), panelEl = document.querySelector('details.panel');
  const measurer = dlgText.cloneNode(); measurer.removeAttribute('id'); measurer.setAttribute('aria-hidden', 'true');
  Object.assign(measurer.style, { position: 'absolute', visibility: 'hidden', height: 'auto', left: '-9999px' });
  let talks = 0, pages = [], page = 0, typing = null, shown = '';

  // Divide ogni battuta in pagine da massimo 2 righe, misurando il testo nel riquadro reale
  function paginate(lines) {
    measurer.style.width = dlgText.clientWidth + 'px'; dlg.appendChild(measurer);
    const lh = parseFloat(getComputedStyle(dlgText).lineHeight), out = [];
    lines.forEach(line => {
      let cur = '';
      line.split(' ').forEach(wd => {
        const test = cur ? cur + ' ' + wd : wd; measurer.textContent = test;
        if (measurer.scrollHeight > lh * 2 + 2 && cur) { out.push(cur); cur = wd; } else cur = test;
      });
      out.push(cur);
    });
    measurer.remove(); return out;
  }
  function typePage() {
    const txt = pages[page]; let i = 0; shown = '';
    dlgText.textContent = ''; dlgNext.hidden = true; talking = txt !== '...';
    clearTimeout(typing);
    const step = () => {
      shown = txt.slice(0, ++i); dlgText.textContent = shown;
      if (i >= txt.length) { typing = null; talking = false; dlgNext.hidden = false; return; }
      const ch = txt[i - 1];
      const delay = txt === '...' ? 340 : '.!?'.includes(ch) ? 170 : ch === ',' || ch === ':' ? 90 : 24;
      typing = setTimeout(step, delay);
    };
    step();
  }
  function openDialog() {
    if (!dlg.hidden) return;
    if (document.activeElement) document.activeElement.blur();
    panelEl.hidden = true;
    dlg.hidden = false; dlg.focus({ preventScroll: true });
    pages = paginate(talks === 0 ? DIALOG_FIRST : DIALOG_AGAIN); page = 0;
    if (talks === 0) waveUntil = performance.now() + 1800;
    talks++;
    document.querySelectorAll('[data-view]').forEach(x => x.setAttribute('aria-pressed', false));
    goTo('dialogo');
    typePage();
  }
  function advance() {
    if (typing) { clearTimeout(typing); typing = null; talking = false; dlgText.textContent = pages[page]; dlgNext.hidden = false; return; }
    if (++page < pages.length) typePage();
    else { dlg.hidden = true; talking = false; panelEl.hidden = false; }
  }
  talkBtn.addEventListener('click', openDialog);
  dlg.addEventListener('click', advance);
  window.addEventListener('keydown', e => {
    if (!dlg.hidden && (e.code === 'Space' || e.key === 'Enter')) { e.preventDefault(); if (!e.repeat) advance(); }
    else if (dlg.hidden && (e.key === 'e' || e.key === 'E') && !e.target.closest('select')) openDialog();
  });

  // bottone "Interagisci" che segue il ragazzo sullo schermo
  const btnPos = new THREE.Vector3();
  function updateTalkButton() {
    head.getWorldPosition(btnPos); btnPos.y += 0.3; btnPos.project(camera);
    const vis = dlg.hidden && btnPos.z < 1 && Math.abs(btnPos.x) < 0.95 && Math.abs(btnPos.y) < 0.95;
    talkBtn.hidden = !vis;
    if (vis) { talkBtn.style.left = ((btnPos.x + 1) / 2 * window.innerWidth) + 'px'; talkBtn.style.top = ((1 - btnPos.y) / 2 * window.innerHeight) + 'px'; }
  }

  // ================= INTERFACCIA =================
  function setDish(id) { const d = DISHES.find(x => x.id === id) || DISHES[0]; drawBoard(d); fillPasta(d); }

  const VIEWS = {
    ingresso: { pos: [0.4, 2.6, FRONT + 4.6], target: [0, 1.25, -0.6] },
    bancone:  { pos: [0.3, 1.6, 1.2], target: [-0.1, 1.2, BACK + 0.6] },
    teglie:   { pos: [-0.12, TOP + 0.55, CZ + 0.55], target: [-0.14, TOP + 0.03, CZ - 0.05] },
    dialogo:  { pos: [BOY_X + 0.3, 1.62, CZ + 1.75], target: [BOY_X, 1.42, BOY_Z] },
    alto:     { pos: [-W * 0.95, 6.2, D * 0.95], target: [0, 0.6, -0.2] },
  };
  let tween = null;
  const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  function goTo(name, instant) {
    const v = VIEWS[name];
    const to = { pos: new THREE.Vector3(...v.pos), target: new THREE.Vector3(...v.target) };
    if (instant || reduced) { camera.position.copy(to.pos); controls.target.copy(to.target); controls.update(); return; }
    tween = { from: { pos: camera.position.clone(), target: controls.target.clone() }, to, t0: performance.now(), dur: 900 };
  }
  document.querySelectorAll('[data-view]').forEach(b => b.addEventListener('click', () => {
    document.querySelectorAll('[data-view]').forEach(x => x.setAttribute('aria-pressed', x === b));
    goTo(b.dataset.view);
  }));

  function resize() {
    const w = window.innerWidth, h = window.innerHeight;
    renderer.setSize(w, h, false);
    camera.aspect = w / h; camera.fov = w < 600 ? 64 : 50; camera.updateProjectionMatrix();
  }
  window.addEventListener('resize', resize);

  // ================= VIA! =================
  setDish(DISHES[0].id);
  resize();
  goTo('ingresso', true);
  const tmp = new THREE.Vector3();
  renderer.setAnimationLoop(now => {
    if (tween) {
      const k = Math.min(1, (now - tween.t0) / tween.dur), e = k < 0.5 ? 2 * k * k : 1 - (-2 * k + 2) ** 2 / 2;
      camera.position.lerpVectors(tween.from.pos, tween.to.pos, e);
      controls.target.lerpVectors(tween.from.target, tween.to.target, e);
      if (k === 1) tween = null;
    }
    controls.update();
    updateBoy(now);
    updateTalkButton();
    walls.forEach(w => { w.g.visible = tmp.copy(camera.position).sub(w.pos).dot(w.n) > -0.02; });
    renderer.render(scene, camera);
  });
})();
</script>
